# Formats and lints staged Python files before every commit.
# Hooks run through `uv run`, so they use the exact ruff/black versions pinned in uv.lock.
# Install once with:  uv run pre-commit install

# Pipeline outputs are written by DVC stages; editing them here would desync dvc.lock.
exclude: ^(reports/(figures|tables|metrics|maps)/|dvc\.lock$)
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint + autofix)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: black
        name: black (format)
        entry: uv run black
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]  # the compiled report PDF is ~3.3 MB
