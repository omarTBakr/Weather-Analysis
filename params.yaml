seed: 42

data:
  kaggle_dataset: nelgiriyewithana/global-weather-repository
  kaggle_file: GlobalWeatherRepository.csv
  raw_path: data/raw/GlobalWeatherRepository.csv

clean:
  # locations with fewer daily observations are dropped (one-off / mis-named entries)
  min_obs_per_location: 365
  # per-location robust outlier fence: Q1 - k*IQR, Q3 + k*IQR  (values outside are capped)
  iqr_k: 3.0
  # heavy-tailed variables are capped at this global quantile instead
  heavy_tail_quantile: 0.999
  # max consecutive missing days filled by time interpolation
  interpolate_limit: 3
  # a day whose median |temp - 15-day rolling median| across all cities exceeds this is a corrupted batch
  corrupt_day_threshold_c: 4.0

features:
  target: temperature_celsius
  horizon: 1            # forecast t + horizon days
  lags: [1, 2, 3, 7, 14]
  rolling_windows: [3, 7, 14]
  exog: [humidity, pressure_mb, wind_kph, cloud, precip_mm, uv_index, feels_like_celsius, visibility_km, gust_kph]

split:
  test_days: 60
  val_days: 60

global_series:
  min_coverage: 0.95    # locations present on >= 95% of days form the stable global mean
  fourier_order: 4
  future_days: 90

anomaly:
  contamination: 0.01
  lof_neighbors: 35
  z_thresh: 3.5
  global_z_thresh: 3.0
  sample_size: 60000

models:
  ridge:
    alpha: 1.0
  random_forest:
    n_estimators: 200
    max_depth: 16
    min_samples_leaf: 5
    max_features: 0.5
  xgboost:
    n_estimators: 2000
    learning_rate: 0.05
    max_depth: 7
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 100
  lightgbm:
    n_estimators: 3000
    learning_rate: 0.03
    num_leaves: 63
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 100

analyses:
  shap_sample: 3000
  permutation_sample: 20000
