[project]
name = "weather-forecasting"
version = "0.1.0"
description = "Global weather trend forecasting pipeline (MLflow + DVC) for the PM Accelerator tech assessment"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "folium>=0.20.0",
    "kagglehub>=1.0.3",
    "kaleido>=1.5.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pycountry-convert>=0.7.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
