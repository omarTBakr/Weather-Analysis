# Reproducible pipeline:  uv run dvc repro      (DAG: uv run dvc dag)
# All configuration lives in .env (loaded by src/weather/utils/config.py); every stage depends on it.
# Every stage also logs a run to MLflow (sqlite:///mlflow.db, experiment "weather-forecasting").
# Figures / tables / metrics use `cache: false` so they are committed to git and render on GitHub;
# data and model binaries are cached by DVC and pushed to the DVC remote.
stages:
  download:
    cmd: python -m weather.data.download
    deps:
      - .env
      - src/weather/utils/config.py
      - src/weather/data/download.py
    outs:
      - data/raw/GlobalWeatherRepository.csv

  clean:
    cmd: python -m weather.data.clean
    deps:
      - .env
      - src/weather/utils/config.py
      - data/raw/GlobalWeatherRepository.csv
      - src/weather/data/clean.py
    outs:
      - data/interim/clean.parquet
      - reports/metrics/daily_batch_deviation.csv:
          cache: false
    metrics:
      - reports/metrics/clean_report.json:
          cache: false

  features:
    cmd: python -m weather.data.features
    deps:
      - .env
      - src/weather/utils/config.py
      - data/interim/clean.parquet
      - src/weather/data/features.py
    outs:
      - data/processed/daily.parquet
      - data/processed/features.parquet
      - data/processed/global_series.parquet
      - models/scaler.joblib
      - models/feature_columns.json
    metrics:
      - reports/metrics/features_report.json:
          cache: false

  eda:
    cmd: python -m weather.analysis.eda
    deps:
      - .env
      - src/weather/utils/config.py
      - data/interim/clean.parquet
      - data/processed/daily.parquet
      - data/processed/global_series.parquet
      - reports/metrics/clean_report.json
      - src/weather/analysis/eda.py
      - src/weather/analysis/decomposition.py
      - src/weather/utils/plotting.py
    outs:
      - reports/figures/eda:
          cache: false
      - reports/tables/summary_statistics.csv:
          cache: false
      - reports/tables/summary_statistics.tex:
          cache: false
    metrics:
      - reports/metrics/eda.json:
          cache: false

  anomaly:
    cmd: python -m weather.analysis.anomaly
    deps:
      - .env
      - src/weather/utils/config.py
      - data/interim/clean.parquet
      - data/processed/global_series.parquet
      - reports/metrics/daily_batch_deviation.csv
      - src/weather/analysis/anomaly.py
      - src/weather/analysis/decomposition.py
      - src/weather/utils/plotting.py
    outs:
      - reports/figures/anomaly:
          cache: false
      - reports/tables/top_anomalies.csv:
          cache: false
      - reports/tables/top_anomalies.tex:
          cache: false
      - reports/tables/global_anomalies.csv:
          cache: false
    metrics:
      - reports/metrics/anomaly.json:
          cache: false

  train:
    cmd: python -m weather.modeling.train
    deps:
      - .env
      - src/weather/utils/config.py
      - data/processed/features.parquet
      - models/scaler.joblib
      - models/feature_columns.json
      - src/weather/modeling/train.py
      - src/weather/utils/metrics.py
      - src/weather/utils/mlflow_utils.py
      - src/weather/utils/plotting.py
    outs:
      - data/processed/predictions.parquet
      - models/ridge.joblib
      - models/random_forest.joblib
      - models/xgboost.joblib
      - models/lightgbm.joblib
    metrics:
      - reports/metrics/train_panel.json:
          cache: false

  train_global:
    cmd: python -m weather.modeling.train_global
    deps:
      - .env
      - src/weather/utils/config.py
      - data/processed/global_series.parquet
      - src/weather/modeling/train_global.py
      - src/weather/utils/metrics.py
      - src/weather/utils/plotting.py
    outs:
      - reports/figures/forecast_global:
          cache: false
      - reports/tables/global_model_comparison.csv:
          cache: false
      - reports/tables/global_model_comparison.tex:
          cache: false
      - reports/tables/global_future_forecast.csv:
          cache: false
    metrics:
      - reports/metrics/train_global.json:
          cache: false

  ensemble:
    cmd: python -m weather.modeling.ensemble
    deps:
      - .env
      - src/weather/utils/config.py
      - data/processed/predictions.parquet
      - data/processed/features.parquet
      - models/ridge.joblib
      - models/random_forest.joblib
      - models/xgboost.joblib
      - models/lightgbm.joblib
      - src/weather/modeling/ensemble.py
      - src/weather/modeling/ensemble_model.py
      - src/weather/utils/metrics.py
      - src/weather/utils/plotting.py
    outs:
      - models/ensemble_config.json
      - reports/figures/forecast_panel:
          cache: false
      - reports/tables/model_comparison.csv:
          cache: false
      - reports/tables/model_comparison.tex:
          cache: false
      - reports/tables/rmse_by_continent.csv:
          cache: false
    metrics:
      - reports/metrics/ensemble.json:
          cache: false

  analyses:
    cmd: python -m weather.insights.run
    deps:
      - .env
      - src/weather/utils/config.py
      - data/processed/daily.parquet
      - data/processed/features.parquet
      - models/lightgbm.joblib
      - models/feature_columns.json
      - src/weather/insights
      - src/weather/utils/plotting.py
    outs:
      - reports/figures/analyses:
          cache: false
      - reports/maps:
          cache: false
      - reports/tables/location_climate_trends.csv:
          cache: false
      - reports/tables/airquality_within_city_corr.csv:
          cache: false
      - reports/tables/airquality_pooled_corr.csv:
          cache: false
      - reports/tables/feature_importance.csv:
          cache: false
      - reports/tables/feature_importance.tex:
          cache: false
      - reports/tables/location_summary.csv:
          cache: false
      - reports/tables/morans_i.csv:
          cache: false
      - reports/tables/continent_summary.csv:
          cache: false
      - reports/tables/continent_summary.tex:
          cache: false
      - reports/tables/country_summary.csv:
          cache: false
    metrics:
      - reports/metrics/analyses.json:
          cache: false
